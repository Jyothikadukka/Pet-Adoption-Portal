{% extends 'adoption/base.html' %}


{% block title %}
Login - PetCare
{% endblock %}



{% block content %}


<section class="auth-section">


<div class="container">


<div class="auth-card">



<div class="auth-header">


<h2>
🐾 Welcome Back
</h2>


<p>
Login to continue your PetCare journey
</p>


</div>





<form method="POST">


{% csrf_token %}



{% if error %}

<div class="alert alert-danger">

{{ error }}

</div>

{% endif %}





<div class="form-group">


<label>
👤 Username
</label>


<input 
type="text"
name="username"
class="form-control"
placeholder="Enter username"
required>


</div>






<div class="form-group">


<label>
🔒 Password
</label>


<div class="password-box">


<input 
type="password"
name="password"
id="password"
class="form-control"
placeholder="Enter password"
required>


<span 
class="password-toggle"
onclick="togglePassword()">

👁️

</span>


</div>


</div>






<div class="remember-box">


<input 
type="checkbox"
name="remember">


<label>

Remember me

</label>


</div>





<button type="submit"
class="auth-btn">

Login

</button>
<p class="forgot-password">

<a href="{% url 'forgot_password' %}">
Forgot Password?
</a>

</p>




<p class="auth-link">

Don't have an account?

<a href="{% url 'register' %}">
Register
</a>


</p>



</form>


</div>


</div>


</section>





<script>


function togglePassword(){


let password =
document.getElementById("password");



if(password.type === "password"){

password.type="text";

}

else{

password.type="password";

}


}


</script>



{% endblock %}
