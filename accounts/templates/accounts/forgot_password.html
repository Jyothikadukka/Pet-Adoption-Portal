{% extends 'adoption/base.html' %}


{% block content %}

<div class="auth-card">


<h2>
Forgot Password 🔐
</h2>


<p>

{% csrf_token %}

placeholder="Enter Email"

<button class="auth-btn">

Send OTP

</button>


</form>


</div>

</div>


{% endblock %}
