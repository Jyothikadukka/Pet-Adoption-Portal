{% extends 'adoption/base.html' %}

{% block title %}
Registration Successful
{% endblock %}


{% block content %}

<section class="auth-section">

<div class="container">

<div class="auth-card success-card">


<div class="success-icon">
    ✓
</div>


<h2>
    Registration Successful!
</h2>


<p>
    Your email has been verified successfully.
</p>


<p>
    Welcome to Pet Adoption Portal 🐾
</p>


<p class="redirect-text">
    Redirecting to login...
</p>


</div>

</div>

</section>



<style>

.success-card {

    text-align:center;
    padding:40px;

}


.success-icon {

    width:90px;
    height:90px;

    margin:auto;
    margin-bottom:20px;

    background:#28a745;

    color:white;

    font-size:60px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    animation: pop 0.6s ease;

}



@keyframes pop {

    0% {

        transform:scale(0);

    }


    70% {

        transform:scale(1.2);

    }


    100% {

        transform:scale(1);

    }

}



.redirect-text {

    margin-top:20px;

    color:gray;

}


</style>



<script>

setTimeout(function(){

    window.location.href = "{% url 'login' %}";

},5000);


</script>


{% endblock %}
