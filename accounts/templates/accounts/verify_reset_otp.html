{% extends 'adoption/base.html' %}

{% block title %}
Verify Reset OTP
{% endblock %}


{% block content %}


<section class="auth-section">

<div class="container">


<div class="auth-card">


<h2>
🔐 Verify OTP
</h2>


<p>
Enter the OTP sent to your email.
</p>


<form method="POST">

{% csrf_token %}


<input
type="text"
name="otp"
class="form-control"
placeholder="Enter 6 digit OTP"
required>


<br>


<button
type="submit"
class="auth-btn">

Verify OTP

</button>


</form>


</div>

</div>

</section>


{% endblock %}
