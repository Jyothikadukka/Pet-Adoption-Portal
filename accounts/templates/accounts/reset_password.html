{% extends 'adoption/base.html' %}


{% block title %}
Reset Password
{% endblock %}



{% block content %}


<section class="auth-section">


<div class="container">


<div class="auth-card">


<h2>
🔑 Create New Password
</h2>


<form method="POST">

{% csrf_token %}


<input
type="password"
name="password"
class="form-control"
placeholder="Enter New Password"
required>


<br>


<input
type="password"
name="confirm_password"
class="form-control"
placeholder="Confirm Password"
required>


<br>


<button
type="submit"
class="auth-btn">

Reset Password

</button>


</form>


</div>


</div>


</section>


{% endblock %}
