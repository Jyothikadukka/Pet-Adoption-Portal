{% extends 'adoption/base.html' %}


{% block title %}
Create Account - PetCare
{% endblock %}



{% block content %}


<section class="auth-section">


<div class="container">


<div class="auth-card">



<div class="auth-header">


<h2>
🐾 Create Account
</h2>


<p>
Join PetCare Community
</p>


</div>





<form method="POST">


{% csrf_token %}



<div class="form-group">

<label>
👤 Username
</label>

{{ form.username }}

</div>




<div class="form-group">

<label>
📧 Email
</label>

{{ form.email }}

</div>





<div class="form-group">

<label>
🔒 Password
</label>

{{ form.password }}
<span 
class="password-toggle"
onclick="togglePassword()">

👁️

</span>


</div>





<button type="submit"
class="auth-btn">

Register

</button>




<p class="auth-link">

Already have an account?

<a href="{% url 'login' %}">
Login
</a>


</p>



</form>


</div>


</div>


</section>



{% endblock %}
