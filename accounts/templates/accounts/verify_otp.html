{% extends 'adoption/base.html' %}

{% block title %}
Verify OTP
{% endblock %}

{% block content %}

<section class="auth-section">

<div class="container">

<div class="auth-card">

<h2>📧 Email Verification</h2>

<p>
OTP has been sent to
<br>
<strong>{{ email }}</strong>
</p>

<form method="POST">

{% csrf_token %}

<input
type="text"
name="otp"
class="form-control"
placeholder="Enter 6-digit OTP"
required>

<br>

<button
type="submit"
class="auth-btn">

Verify OTP

</button>
<br>

<a href="{% url 'resend_otp' %}"
class="btn btn-secondary">

Resend OTP

</a>

</form>

</div>

</div>

</section>

{% endblock %}
